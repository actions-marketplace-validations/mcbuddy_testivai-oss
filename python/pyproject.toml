[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testivai"
version = "0.1.0"
description = "Local-first visual regression capture for playwright-python — pixel + DOM diff, tunable tolerances, PR approvals; shares baselines with the JS/TS TestivAI adapters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "TestivAI" }]
keywords = ["playwright", "visual-regression", "testing", "screenshot-testing", "pytest"]
classifiers = [
  "Framework :: Pytest",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
# playwright is not a hard dependency: witness() duck-types the Page object,
# and unit tests run without a browser. Install extras for the full setup.
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.40", "pytest-playwright>=0.4"]

[project.urls]
Homepage = "https://github.com/mcbuddy/testivai-oss"
Documentation = "https://github.com/mcbuddy/testivai-oss/blob/main/docs/frameworks/python.md"

[project.entry-points.pytest11]
testivai = "testivai.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/testivai"]
