# Dependabot configuration for testivai-oss
#
# Keeps npm dependencies and GitHub Actions up to date weekly.
# Groups patch + minor updates together to reduce PR churn; major
# updates land as individual PRs because they may need attention.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root workspace (covers all packages via pnpm workspace)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Bundle non-major updates so we get one PR per ecosystem instead of N
      npm-non-major:
        update-types:
          - "minor"
          - "patch"

  # GitHub Action source (action/dist must be rebuilt; surface major bumps)
  - package-ecosystem: "npm"
    directory: "/action"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-action"
    commit-message:
      prefix: "chore(deps,action)"
      include: "scope"
    groups:
      action-non-major:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in our workflows (CI, release, codeql)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
